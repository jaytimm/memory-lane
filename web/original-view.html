<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Original photograph — Memory Lane</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171513; }
    body { display: grid; grid-template-rows: auto 1fr; color: #f7f1e8; font: 15px system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 10px 16px; background: #25211e; }
    #filename { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button { border: 1px solid #ffffff70; border-radius: 7px; background: #b94f32; color: white; cursor: pointer; padding: 8px 13px; white-space: nowrap; }
    main { min-width: 0; min-height: 0; display: grid; place-items: center; }
    img { display: block; width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <header>
    <span id="filename">Original photograph</span>
    <button id="close" type="button">Close</button>
  </header>
  <main><img id="original" alt="Original photograph"></main>
  <script>
    (() => {
      "use strict";
      const parameters = new URLSearchParams(window.location.search);
      const id = parameters.get("id");
      const name = parameters.get("name") || "Original photograph";
      document.title = `${name} — Memory Lane`;
      document.querySelector("#filename").textContent = name;
      if (id) document.querySelector("#original").src = `/api/original/${encodeURIComponent(id)}`;
      document.querySelector("#close").addEventListener("click", () => window.close());
    })();
  </script>
</body>
</html>
