name: Build portable Windows gallery search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows-portable.yml"
      - "src/**"
      - "windows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Create portable Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $PWD "dist\WindowsSearch\runtime"
          $packages = Join-Path $runtime "Lib\site-packages"
          New-Item -ItemType Directory -Force -Path $packages | Out-Null

          $pythonZip = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          Invoke-WebRequest `
            -Uri "https://www.python.org/ftp/python/3.12.6/python-3.12.6-embeddable-amd64.zip" `
            -OutFile $pythonZip
          Expand-Archive -Path $pythonZip -DestinationPath $runtime

          @(
            "python312.zip"
            "."
            ".."
            "Lib\site-packages"
            "import site"
          ) | Set-Content -Encoding ASCII (Join-Path $runtime "python312._pth")

          $getPip = Join-Path $env:RUNNER_TEMP "get-pip.py"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPip
          & (Join-Path $runtime "python.exe") $getPip

      - name: Install CPU inference dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = Join-Path $PWD "dist\WindowsSearch\runtime\python.exe"
          & $python -m pip install `
            --index-url https://download.pytorch.org/whl/cpu `
            --no-deps `
            torch==2.9.1 torchvision==0.24.1
          & $python -m pip install `
            open_clip_torch==3.3.0 timm==1.0.30

      - name: Add launcher source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $destination = Join-Path $PWD "dist\WindowsSearch\src"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item src\__init__.py,src\archive_data.py,src\clip_model.py,src\search.py,src\serve.py $destination
          Copy-Item "windows\Start Family Gallery.bat" "dist\Start Family Gallery.bat"
          Copy-Item "windows\README-WINDOWS.txt" "dist\README-WINDOWS.txt"

      - name: Smoke-test portable runtime
        shell: pwsh
        working-directory: dist/WindowsSearch
        run: |
          $output = & .\runtime\python.exe -c "import torch, torchvision, open_clip, numpy; from src.serve import parse_search_request; assert parse_search_request({'query':'a parrot'})['query'] == 'a parrot'; print(torch.__version__, open_clip.__version__)" 2>&1
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $message = (($output | Out-String).Trim() -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
            Write-Host "::error title=Portable runtime smoke test::$message"
            exit 1
          }

      - name: Upload portable Windows launcher
        uses: actions/upload-artifact@v4
        with:
          name: FamilyGallery-Windows-x64
          path: dist/
          compression-level: 9
          retention-days: 14
          if-no-files-found: error
